[alembic]
script_location = alembic
sqlalchemy.url = ${MIGRATIONS_DATABASE_URL}

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[formatter_generic]
format = %(asctime)s %(levelname)s %(name)s %(message)s

[logger_alembic]
level = INFO
handlers = console
qualify = True
propagate = True