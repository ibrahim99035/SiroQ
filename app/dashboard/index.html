<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SiroQ Analysis Dashboard</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">S</span>
    <span><strong>SiroQ</strong> Analysis Dashboard</span>
  </div>
  <div class="top-actions">
    <button id="reloadBtn" class="btn">Reload</button>
    <button id="openReportBtn" class="btn primary" disabled>Open printable report</button>
    <button id="dlJsonBtn" class="btn" disabled>Download JSON</button>
    <button id="keyBtn" class="btn ghost">API key</button>
  </div>
</header>

<div id="keyModal" class="modal-backdrop" hidden>
  <div class="modal">
    <h3>API key required</h3>
    <p class="modal-note">
      Enter the SiroQ API key (<code>X-API-Key</code>) to load your applications.
      It is stored in this browser only.
    </p>
    <input id="keyInput" type="password" placeholder="API key" autocomplete="off" spellcheck="false">
    <div id="keyMsg" class="key-msg"></div>
    <div class="modal-actions">
      <button id="keySaveBtn" class="btn primary">Save key</button>
      <button id="keyCancelBtn" class="btn ghost">Cancel</button>
    </div>
  </div>
</div>

<main class="layout">
  <aside class="sidebar">
    <div class="side-label">Applications</div>
    <nav id="appNav" class="nav-list"></nav>
    <div class="side-label" id="appLabel" hidden>Analyses</div>
    <nav id="analysisNav" class="nav-list analyses"></nav>
  </aside>

  <section class="content" id="mainContent">
    <div id="appHeader"></div>
    <div id="emptyBanner"></div>
    <div class="kpis" id="summaryBox"></div>
    <div class="charts-grid wide">
      <div class="chart-block">
        <h4>Categories detected across files</h4>
        <div class="chart"><div id="categoryBox" style="width:100%"></div></div>
      </div>
      <div class="chart-block">
        <h4>Application trends</h4>
        <div id="trendBox"></div>
      </div>
    </div>
    <h3 class="section-title">Files</h3>
    <div id="filesBox"></div>
  </section>
</main>

<script src="charts.js"></script>
<script src="app.js"></script>
</body>
</html>
