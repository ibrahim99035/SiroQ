{% extends "base.html" %}
{% block title %}Applications{% endblock %}
{% block content %}
<h2>Applications</h2>
<a href="/applications/new" class="btn btn-primary mb-3">New Application</a>
<table class="table table-striped">
    <thead><tr><th>Name</th><th>Source</th><th>Status</th><th></th></tr></thead>
    <tbody>
    {% for app in apps %}
        <tr>
            <td>{{ app.name }}</td>
            <td>{{ app.source_type }}</td>
            <td>{{ app.status }}</td>
            <td><a class="btn btn-sm btn-outline-primary" href="/applications/{{ app.id }}">Open</a></td>
        </tr>
    {% else %}
        <tr><td colspan="4" class="text-muted">No applications yet.</td></tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
