<tbody>
    {% for row in rows %}
    <tr>
        <td>{{ row.id }}</td>
        <td>{{ row.association_name }}</td>
        <td>{{ row.pharmacy_name }}</td>
        <td>{{ row.application_name }}</td>
        <td>
            <button class="btn btn-sm btn-primary" onclick="editCell({{ row.id }}, 'column_name')">Edit</button>
        </td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="5">No data available</td>
    </tr>
    {% endfor %}
</tbody>
