{% extends "base.html" %}
{% block title %}Data Explorer{% endblock %}
{% block content %}
<h2>Data Explorer</h2>
<p class="text-muted">Live Silver data for application <code>{{ application_id }}</code>. Edits are audit-logged and reversible.</p>

<div id="grid-container" hx-get="/applications/{{ application_id }}/explorer/rows" hx-trigger="load" hx-swap="innerHTML">
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Timestamp</th>
                <th>Payment</th>
                <th>Total</th>
                <th>Edit</th>
                <th>Revert</th>
            </tr>
        </thead>
        <tbody><tr><td colspan="5" class="text-muted">Loading…</td></tr></tbody>
    </table>
</div>
{% endblock %}
