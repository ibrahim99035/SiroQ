{% extends "base.html" %}
{% block title %}Users{% endblock %}
{% block content %}
<h2>Users</h2>
<table class="table table-striped">
    <thead><tr><th>Email</th><th>Role</th><th>Pharmacy</th></tr></thead>
    <tbody>
    {% for u in users %}
        <tr><td>{{ u.email }}</td><td>{{ u.role }}</td><td>{{ u.pharmacy_id or "Association-wide" }}</td></tr>
    {% else %}
        <tr><td colspan="3" class="text-muted">No users.</td></tr>
    {% endfor %}
    </tbody>
</table>
<form method="POST" action="/admin/users" class="row g-2">
    <div class="col-auto"><input class="form-control" name="email" type="email" placeholder="Email" required></div>
    <div class="col-auto"><input class="form-control" name="full_name" placeholder="Full name" required></div>
    <div class="col-auto">
        <select class="form-select" name="role" required>
            <option value="">Role…</option>
            {% for r in valid_roles %}<option value="{{ r }}">{{ r }}</option>{% endfor %}
        </select>
    </div>
    <div class="col-auto">
        <select class="form-select" name="pharmacy_id">
            <option value="">Association-wide</option>
            {% for p in pharmacies %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}
        </select>
    </div>
    <div class="col-auto"><button class="btn btn-primary">Create</button></div>
</form>
{% endblock %}
