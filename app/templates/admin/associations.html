{% extends "base.html" %}
{% block title %}Associations{% endblock %}
{% block content %}
<h2>Associations</h2>
<table class="table table-striped">
    <thead><tr><th>Name</th><th>Country</th><th>Currency</th></tr></thead>
    <tbody>
    {% for a in associations %}
        <tr><td>{{ a.name }}</td><td>{{ a.country or "" }}</td><td>{{ a.default_currency }}</td></tr>
    {% else %}
        <tr><td colspan="3" class="text-muted">No associations.</td></tr>
    {% endfor %}
    </tbody>
</table>
<form method="POST" action="/admin/associations" class="row g-2">
    <div class="col-auto"><input class="form-control" name="name" placeholder="Name" required></div>
    <div class="col-auto"><button class="btn btn-primary">Create</button></div>
</form>
{% endblock %}
