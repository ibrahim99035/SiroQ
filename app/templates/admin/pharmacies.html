{% extends "base.html" %}
{% block title %}Pharmacies{% endblock %}
{% block content %}
<h2>Pharmacies</h2>
<table class="table table-striped">
    <thead><tr><th>Name</th><th>Association</th><th>Region</th></tr></thead>
    <tbody>
    {% for p in pharmacies %}
        <tr><td>{{ p.name }}</td><td>{{ p.association_id }}</td><td>{{ p.region or "" }}</td></tr>
    {% else %}
        <tr><td colspan="3" class="text-muted">No pharmacies.</td></tr>
    {% endfor %}
    </tbody>
</table>
<form method="POST" action="/admin/pharmacies" class="row g-2">
    <div class="col-auto"><input class="form-control" name="name" placeholder="Name" required></div>
    <div class="col-auto">
        <select class="form-select" name="association_id" required>
            <option value="">Association…</option>
            {% for a in associations %}<option value="{{ a.id }}">{{ a.name }}</option>{% endfor %}
        </select>
    </div>
    <div class="col-auto"><button class="btn btn-primary">Create</button></div>
</form>
{% endblock %}
