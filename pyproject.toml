[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "siroq-analytics"
version = "0.1.0"
description = "Deep-analysis service: ingest application files, profile/classify/score them, and serve JSON + HTML reports."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy==2.0.35",
    "alembic==1.13.2",
    "psycopg[binary]==3.2.1",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "jinja2==3.1.4",
    "python-multipart==0.0.9",
    "passlib[bcrypt]==1.7.4",
    "itsdangerous==2.2.0",
    "pandas==2.2.2",
    "openpyxl==3.1.5",
    "python-calamine>=0.2.0",
    "rapidfuzz==3.9.6",
    "geoalchemy2==0.15.2",
    "python-dotenv==1.0.1",
    "apscheduler==3.10.4",
]

[project.optional-dependencies]
# Test / development tooling (not shipped in the wheel)
dev = [
    "pytest==8.3.2",
    "httpx==0.27.2",
    "build==1.2.1",
]

[project.urls]
Homepage = "https://github.com/ibrahim99035/SiroQ"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = [
    "templates/*.html",
    "dashboard/*",
]

[tool.setuptools.data-files]
"." = ["alembic.ini"]
"alembic" = [
    "alembic/env.py",
    "alembic/script.py.mako",
    "alembic/versions/*.py",
]