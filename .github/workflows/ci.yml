name: ci

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write       # release creation (tags)
  packages: write       # GHCR image push

jobs:
  # --- run the test suite against a throwaway Postgres service container ---
  #
  # Plain Postgres, not PostGIS: migration 001 deliberately does not install
  # PostGIS and no column uses a geometry type, so the extension was only ever
  # making this image heavier. Keep the major version in step with the Neon
  # branch the service actually deploys against.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: siroq
          POSTGRES_PASSWORD: siroq_dev_password
          POSTGRES_DB: siroq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U siroq -d siroq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://siroq_app:siroq_app_dev_password@localhost:5432/siroq
      MIGRATIONS_DATABASE_URL: postgresql+psycopg://siroq:siroq_dev_password@localhost:5432/siroq
      STORAGE_PATH: /tmp/siroq_ci_storage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      # Mirrors docker/init-db/01_create_app_role.sql, which now documents Neon
      # provisioning and names the `neondb` database, so it cannot be replayed
      # against this container. Only pgcrypto: see migration 001.
      - name: Create least-privilege app role
        run: |
          PGPASSWORD=siroq_dev_password psql -h 127.0.0.1 -U siroq -d siroq \
            -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE ROLE siroq_app LOGIN PASSWORD 'siroq_app_dev_password';
          GRANT CONNECT ON DATABASE siroq TO siroq_app;
          GRANT USAGE ON SCHEMA public TO siroq_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
              GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO siroq_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
              GRANT USAGE, SELECT ON SEQUENCES TO siroq_app;
          SQL
          PGPASSWORD=siroq_dev_password psql -h 127.0.0.1 -U siroq -d siroq -c "
            GRANT ALL ON ALL TABLES IN SCHEMA public TO siroq_app;
            GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO siroq_app;
          "
      - name: Run tests
        run: python -m pytest -q

  # --- build the Python package (wheel + sdist) ---
  build-package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: pip install build
      - name: Build wheel + sdist
        run: python -m build
      - name: Smoke-check the wheel contents
        run: |
          python - <<'PY'
          import zipfile, glob
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          for needle in ("app/templates/report.html", "app/dashboard/index.html", "app/analytics_service/registry.py", "alembic.ini"):
              assert any(needle in n for n in names), needle
          print("wheel ok:", whl)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: siroq-dist
          path: dist/*
          if-no-files-found: error
      - name: Publish GitHub release on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz \
              --title "SiroQ $GITHUB_REF_NAME" --generate-notes
          fi

  # --- container package: build image, push to GHCR on main / version tags ---
  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4
      - name: Set image tags
        id: meta
        run: |
          IMG="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="${GITHUB_REF#refs/tags/}"; else TAG="latest"; fi
          echo "image=$IMG:$TAG" >> "$GITHUB_OUTPUT"
          echo "image_latest=$IMG:latest" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}, ${{ steps.meta.outputs.image_latest }}